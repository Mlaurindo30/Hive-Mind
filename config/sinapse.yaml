# sinapse.yaml — Sinapse Agent central configuration
# Universal memory layer for any agent (Hermes, Claude Code, Codex, OpenCode, Cursor)

# =============================================================================
# PROJECT
# =============================================================================
project:
  name: sinapse_agent
  version: 2.0.0
  description: >
    Universal memory layer for AI agents. Indexes an Obsidian vault
    (cerebro/) into a knowledge graph queryable via Graphify, complemented by
    granular event tracking (claude-mem) and execution optimization (RTK).
    One clone, one ./install.sh, every agent connected.

# =============================================================================
# VAULT (single source of truth)
# =============================================================================
vault:
  path: cerebro/                          # relative to the project root
  format: obsidian                        # Obsidian vault with YAML frontmatter
  language: pt-BR                         # vault content language
  indexer: graphify                       # tool that indexes the vault
  watch: true                             # auto-reindexes when changes are detected

# =============================================================================
# GRAPHIFY (layer 1 — structural: WHAT exists)
# =============================================================================
graphify:
  package: graphifyy                      # PyPI package name (double-y)
  install_method: uv                      # uv | pipx | pip
  extras: [all]                           # pdf, office, video, mcp, neo4j, ollama, etc
  output_dir: cerebro/cortex/occipital/grafo/  # anatomical output of the knowledge graph
  mcp_port: 0                             # 0 = stdio, or port for HTTP
  watch: true                             # --watch flag
  obsidian_export: true                   # --obsidian flag
  global_graph: false                     # --global (enable for multi-project)

# =============================================================================
# CLAUDE-MEM (layer 2 — temporal: WHO/WHEN)
# =============================================================================
claude_mem:
  port: 37700                             # default worker port
  install_method: npx                     # npx claude-mem install
  worker_autostart: true                  # starts the worker alongside

# =============================================================================
# NEURAL MEMORY (layer 4 — associative: HOW concepts relate)
# =============================================================================
neural_memory:
  package: neural-memory                # pipx install neural-memory
  install_method: source                  # uv pip install -e integrations/neural-memory/
  src_dir: integrations/neural-memory/    # local source
  recall_timeout: 5                     # seconds

# =============================================================================
# RTK (layer 3 — execution: HOW to optimize)
# =============================================================================
rtk:
  source_dir: integrations/rtk/
  binary: integrations/rtk/target/release/rtk
  wrapper: scripts/services/start-rtk.sh
  install_method: "rtk init <target>"
  role: >
    Cross-cutting shell command optimizer. Not a read backend,
    does not participate in sinapse_query, and must be configured per agent/CLI.
  targets:
    global:
      - claude
      - codex
      - gemini
      - cursor
      - windsurf
      - copilot
      - opencode
      - pi
    project:
      - hermes
      - cline
      - roo
      - kilocode
      - kilo
      - antigravity

# =============================================================================
# SINAPSE MCP (universal read + write server)
# =============================================================================
sinapse_mcp:
  command: "python3 scripts/services/sinapse-mcp.py"
  transport: stdio
  enabled: true
  config_template: mcp/sinapse-memory.json
  tools:
    - sinapse_query          # canonical hybrid search across all backends
    - sinapse_save_decision   # saves a decision to the vault
    - sinapse_save_learning   # saves a learning to Patterns.md
    - sinapse_health          # full health check
    - sinapse_session_end     # ends the session, updates Current State
    - sinapse_temporal_search # claude-mem step 1: global textual index
    - sinapse_temporal_timeline # claude-mem step 2: chronological context by ID/query
    - sinapse_temporal_get_observations # claude-mem step 3: full details for filtered IDs
    - sinapse_temporal_save   # saves an observation to claude-mem or vault fallback
    - sinapse_zettelkasten_split # splits monolithic notes into atomic Zettelkasten notes
    - sinapse_capture_screen  # captures a screenshot and saves it as visual memory
    - sinapse_plan_goal       # decomposes a goal into atomic steps
    - sinapse_temporal_graph_search # Graphiti/FalkorDB compat; prefer sinapse_query
    - sinapse_rag_query       # multi-hop LightRAG query over consolidated memories
    - search_memories         # HNSW/FTS search over the vault

# =============================================================================
# SUPPORTED AGENTS
# =============================================================================
agents:
  supported:
    - hermes        # native: Python plugin with pre_prompt / post_tool / post_session hooks
    - claude-code   # mcp: sinapse-mcp.py + CLAUDE.md
    - codex         # mcp: sinapse-mcp.py + AGENTS.md
    - kilocode      # mcp: sinapse-mcp.py + AGENTS.md
    - openclaw      # mcp: sinapse-mcp.py + workspace files
    - copilot       # mcp: via GitHub MCP integration
    - opencode      # mcp: sinapse-mcp.py + AGENTS.md
    - gemini-cli    # mcp: sinapse-mcp.py + GEMINI.md
    - zoocode       # mcp: sinapse-mcp.py (successor to Roo Code)
    - cursor        # mcp: sinapse-mcp.py + AGENTS.md
    - aider         # mcp: sinapse-mcp.py
  integration_methods:
    native: [hermes]
    mcp: [claude-code, codex, kilocode, openclaw, copilot, opencode, gemini-cli, zoocode, cursor, aider]
    workspace: [openclaw]
    cli: [sinapse-write]
  install_methods:
    hermes: "graphify install --platform hermes"
    claude-code: "configure MCP server sinapse-memory in <project>/.mcp.json (project scope)"
    codex: "configure MCP server sinapse-memory in ~/.codex/mcp.json"
    kilocode: "configure MCP server sinapse-memory in kilo.json"
    openclaw: "configure MCP server sinapse-memory in ~/.openclaw/openclaw.json"
    copilot: "configure MCP server sinapse-memory"
    opencode: "configure MCP server sinapse-memory"
    gemini-cli: "configure MCP server sinapse-memory"
    zoocode: "configure MCP server sinapse-memory"
    cursor: "configure MCP server sinapse-memory"
    aider: "configure MCP server sinapse-memory"

# =============================================================================
# MCP SERVERS
# =============================================================================
mcp_servers:
  graphify:
    command: "bash scripts/serve-graph.sh"
    transport: stdio
    enabled: true
  claude_mem:
    command: "scripts/services/start-claude-mem-mcp.sh"
    transport: stdio
    port: 37700
    enabled: true
  sinapse_memory:
    command: "python3 scripts/services/sinapse-mcp.py"
    transport: stdio
    enabled: true

# =============================================================================
# CLOUD (Phase 4.3 — VPS decoupling)
# =============================================================================
cloud:
  enabled: false                          # If true, local hooks act as cloud clients
  url: "http://localhost:8000"           # Default endpoint for local testing
  api_key: "${SINAPSE_API_KEY}"          # Secure authentication token

# =============================================================================
# FILESYSTEM (layer 5 — hybrid direct vault search)
# =============================================================================
# The filesystem backend eliminates Graphify's indexing gap (up to 6h) by doing
# direct search over the vault's .md files. It acts as a fallback when
# graph.json is unavailable, or as a complementary source for the most recent data.
# It is the central component of HYBRID SEARCH — cross-backend deduplication ensures
# the same file doesn't show up twice when Graphify + filesystem
# index the same content.
# =============================================================================
hybrid_search:
  enabled: true
  backends:
    - graphify        # layer 1 — structural (indexed every 6h)
    - claude_mem      # layer 2 — temporal (real-time events)
    - neural_memory   # layer 4 — associative (conceptual relationships)
    - filesystem      # layer 5 — direct (real-time reads of .md files)
  components:
    - rtk             # execution layer: optimizes shell, does not return memory
  filesystem:
    enabled: true
    categories:       # vault directories scanned for direct search
      - cortex/temporal
      - cortex/frontal/decisoes
      - cortex/frontal/trabalho
      - cortex/frontal/brain
      - cortex/frontal/org
      - cortex/parietal/inbox
      - cortex/parietal/referencias
      - cerebelo/padroes
      - tronco/modelos
    cache_ttl: 30     # seconds — recursive scan cache TTL
    max_results: 15   # limit of observations returned per search
  dedup:              # eliminates cross-backend duplicates
    enabled: true
    keys:             # fields used to identify duplicates
      observations:
        - source_file
        - title
        - content
      nodes:
        - id
        - label

# =============================================================================
# MODEL GATEWAY (Priority 1 — role/capability-based LLM routing, opt-in)
# =============================================================================
# Disabled by default: with model_gateway.enabled: false, every LLM call
# keeps using core/llm_client.py exactly as before this section existed.
# See specs/model-gateway.md and docs/13-model-gateway.md.
model_gateway:
  enabled: false
  config: config/model-gateway.yaml
  fail_open_to_legacy_llm_client: true    # MODEL_GATEWAY_ENABLED=true but config
                                           # missing/broken -> fall back to legacy,
                                           # never raise into the caller (logged)
  telemetry: true

# =============================================================================
# CRON
# =============================================================================
cron:
  sync_schedule: "0 */6 * * *"            # every 6 hours
  rebuild_schedule: "0 2 * * 0"           # sunday 2am full rebuild
