# ─── Docker compose projects ───────
compose_projects:
  - name: falkordb
    file: docker-compose.falkordb.yml
    profiles: [local-full]
    health_check:
      type: tcp
      host: "127.0.0.1"
      port: 6379
      timeout_seconds: 60
  - name: milvus
    file: integrations/milvus/docker-compose.yml
    profiles: [local-full]
    health_check:
      type: tcp
      host: "127.0.0.1"
      port: 19530
      timeout_seconds: 120
  - name: ragflow
    file: integrations/ragflow/docker-compose.yml
    profiles: [local-full]
    health_check:
      type: http
      url: "http://127.0.0.1:9380/api/v1/system/healthz"
      expected_status: [200]
      timeout_seconds: 180
  - name: langfuse
    file: integrations/langfuse/docker-compose.yml
    profiles: [local-full]
    required: false
    health_check:
      type: http
      url: "http://127.0.0.1:3000/api/public/health"
      expected_status: [200]
      timeout_seconds: 60

# ─── Restart policy global ─────────────────────────────────────
restart:
  default_policy: on-failure
  default_delay_seconds: 15
  default_max_delay_seconds: 120
  default_limit: 10
  on_circuit_open: log_and_mark_degraded
